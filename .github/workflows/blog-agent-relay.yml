name: UTILWISE Blog Agent Relay
on:
  push:
    branches:
      - 'blog-agent-request/**'
    paths:
      - 'requests/post.json'
permissions:
  contents: read
concurrency:
  group: utilwise-blog-agent-${{ github.ref }}
  cancel-in-progress: false
jobs:
  save-draft:
    name: Save or inspect blog draft
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout request branch
        uses: actions/checkout@v4
      - name: Validate request
        shell: bash
        run: |
          set -euo pipefail
          test -f requests/post.json
          ACTION="$(jq -r '.action // "save"' requests/post.json)"
          if [ "$ACTION" = "lookup" ]; then
            jq -e '((.slug // .title) | type == "string" and length > 0 and length <= 180)' requests/post.json > /dev/null
          else
            jq -e '(.post | type == "object") and (.post.language == "ko" or .post.language == "en") and (.post.title | type == "string" and length > 0 and length <= 180) and (.post.content_md | type == "string" and length <= 100000)' requests/post.json > /dev/null
          fi
      - name: Save or inspect post
        env:
          BLOG_AGENT_API_TOKEN: ${{ secrets.BLOG_AGENT_API_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail
          test -n "$BLOG_AGENT_API_TOKEN" || { echo "::error::Repository secret BLOG_AGENT_API_TOKEN is missing"; exit 1; }
          ACTION="$(jq -r '.action // "save"' requests/post.json)"
          if [ "$ACTION" = "lookup" ]; then
            SLUG="$(jq -r '.slug // empty' requests/post.json)"
            TITLE="$(jq -r '.title // empty' requests/post.json)"
            RESPONSE="$(curl --silent --show-error --fail-with-body -H "Authorization: Bearer $BLOG_AGENT_API_TOKEN" https://utilwise.kr/api/agent/blog/posts)"
            MATCH="$(printf '%s\n' "$RESPONSE" | jq -c --arg slug "$SLUG" --arg title "$TITLE" '[.posts[] | select(($slug != "" and .slug == $slug) or ($title != "" and .title == $title))]')"
            echo "## UTILWISE 게시글 조회 결과" >> "$GITHUB_STEP_SUMMARY"
            printf '%s\n' "$MATCH" | jq 'map({id, slug, title, language, status, updated_at})' >> "$GITHUB_STEP_SUMMARY"
            printf '%s\n' "$MATCH" | jq -c '.[] | {id, slug, title, language, status, updated_at}'
          else
            jq '.post | .status = "draft" | del(.cover_image_key)' requests/post.json > /tmp/post.json
            RESPONSE="$(curl --silent --show-error --fail-with-body -H "Authorization: Bearer $BLOG_AGENT_API_TOKEN" -H "Content-Type: application/json" --data-binary @/tmp/post.json https://utilwise.kr/api/agent/blog/posts)"
            echo "## UTILWISE 블로그 임시저장 결과" >> "$GITHUB_STEP_SUMMARY"
            printf '%s\n' "$RESPONSE" | jq . >> "$GITHUB_STEP_SUMMARY"
          fi
