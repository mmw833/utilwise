name: UTILWISE Blog Agent Relay
on:
  push:
    branches:
      - 'blog-agent-request/**'
    paths:
      - 'requests/post.json'
permissions:
  contents: read
concurrency:
  group: utilwise-blog-agent-${{ github.ref }}
  cancel-in-progress: false
jobs:
  fetch-post:
    name: Find existing draft
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Fetch matching draft
        env:
          BLOG_AGENT_API_TOKEN: ${{ secrets.BLOG_AGENT_API_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail
          RESPONSE="$(curl --silent --show-error --fail-with-body -H "Authorization: Bearer $BLOG_AGENT_API_TOKEN" https://utilwise.kr/api/agent/blog/posts)"
          printf '%s\n' "$RESPONSE" | jq -c '.posts[] | select(.slug == "how-to-compress-images") | {id, slug, title, language, status, updated_at}'
