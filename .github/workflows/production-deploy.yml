name: Production Deploy

on:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: utilwise-production-deploy
  cancel-in-progress: false

jobs:
  deploy:
    name: Build, migrate and deploy production Worker
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install dependencies
        run: npm install
      - name: Build OpenNext Worker
        run: npx opennextjs-cloudflare build
      - name: Apply production D1 migrations
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: 22d2885f057f1bde31d4638a26c107bb
        run: |
          if [ -z "$CLOUDFLARE_API_TOKEN" ]; then
            echo "::error::CLOUDFLARE_API_TOKEN repository secret is missing."
            exit 1
          fi
          npx wrangler d1 migrations apply utilwise-blog --remote --config wrangler.jsonc
      - name: Deploy production Worker
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: 22d2885f057f1bde31d4638a26c107bb
        run: npx wrangler deploy --config wrangler.jsonc
