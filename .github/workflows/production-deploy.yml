name: Production Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: utilwise-production-deploy
  cancel-in-progress: false

jobs:
  deploy:
    name: Build, migrate and deploy production Worker
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install dependencies
        run: npm install
      - name: Build OpenNext Worker
        run: npx opennextjs-cloudflare build
      - name: Apply production D1 migrations
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: 22d2885f057f1bde31d4638a26c107bb
        run: |
          if [ -z "$CLOUDFLARE_API_TOKEN" ]; then
            echo "::error::CLOUDFLARE_API_TOKEN repository secret is missing."
            exit 1
          fi
          npx wrangler d1 migrations apply utilwise-blog --remote --config wrangler.jsonc
      - name: Deploy production Worker
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: 22d2885f057f1bde31d4638a26c107bb
        run: npx wrangler deploy --config wrangler.jsonc
      - name: Purge stale favicon cache
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ZONE_ID: caad14f3d32670b5acd9d2c7d2417f4b
        run: |
          if [ -z "$CLOUDFLARE_API_TOKEN" ]; then
            echo "::error::CLOUDFLARE_API_TOKEN repository secret is missing."
            exit 1
          fi
          response="$(curl --fail-with-body --silent --show-error --retry 2 --retry-all-errors \
            "https://api.cloudflare.com/client/v4/zones/$CLOUDFLARE_ZONE_ID/purge_cache" \
            -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" \
            -H "Content-Type: application/json" \
            --data '{"files":["https://utilwise.kr/favicon.ico"]}')"
          echo "$response" | jq -e '.success == true' >/dev/null
          echo "Purged cached response for https://utilwise.kr/favicon.ico"
