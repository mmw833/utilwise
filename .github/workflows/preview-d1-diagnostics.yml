name: Preview D1 Diagnostics

on:
  workflow_dispatch:
  push:
    branches:
      - feat/blog-inline-image-editing

permissions:
  contents: read

jobs:
  inspect-preview-d1:
    name: Inspect isolated Preview D1 (read-only)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install dependencies
        run: npm ci
      - name: Verify Cloudflare credentials are available
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: 22d2885f057f1bde31d4638a26c107bb
        run: |
          if [ -z "$CLOUDFLARE_API_TOKEN" ]; then
            echo "::error::CLOUDFLARE_API_TOKEN repository secret is missing."
            exit 1
          fi
      - name: List D1 databases (read-only)
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: 22d2885f057f1bde31d4638a26c107bb
        run: npx wrangler d1 list --json
      - name: List unapplied Preview D1 migrations (read-only)
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: 22d2885f057f1bde31d4638a26c107bb
        run: npx wrangler d1 migrations list utilwise-blog --preview --config wrangler.preview.jsonc
      - name: Inspect Preview D1 schema (read-only)
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: 22d2885f057f1bde31d4638a26c107bb
        run: |
          npx wrangler d1 execute utilwise-blog --preview --config wrangler.preview.jsonc --command "SELECT type, name, sql FROM sqlite_master WHERE name NOT LIKE 'sqlite_%' ORDER BY type, name;" --json
