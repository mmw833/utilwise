name: Blog Preview Deploy

on:
  push:
    branches:
      - preview/blog-system
      - fix/admin-single-password-auth
      - feat/blog-editor-improvements

permissions:
  contents: read

concurrency:
  group: blog-preview-deploy
  cancel-in-progress: true

jobs:
  deploy:
    name: Build and deploy blog branch preview
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout current preview source
        uses: actions/checkout@v4
        with:
          ref: ${{ github.ref }}
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install dependencies
        run: npm install
      - name: Build OpenNext Worker
        run: npx opennextjs-cloudflare build
      - name: Apply pending Preview D1 migrations
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: 22d2885f057f1bde31d4638a26c107bb
        run: |
          if [ -z "$CLOUDFLARE_API_TOKEN" ]; then
            echo "::error::CLOUDFLARE_API_TOKEN repository secret is missing."
            exit 1
          fi
          npx wrangler d1 migrations apply utilwise-blog --remote --config wrangler.preview.jsonc
      - name: Deploy isolated preview Worker
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: 22d2885f057f1bde31d4638a26c107bb
        run: |
          if [ -z "$CLOUDFLARE_API_TOKEN" ]; then
            echo "::error::CLOUDFLARE_API_TOKEN repository secret is missing."
            exit 1
          fi
          npx wrangler deploy --config wrangler.preview.jsonc
      - name: Smoke test Korean and English blog pages
        run: |
          for path in /blog /en/blog; do
            echo "Checking $path"
            curl --retry 5 --retry-delay 2 --retry-connrefused -fsS "https://utilwise-preview.mmw833.workers.dev$path" -o /tmp/blog-preview.html
            grep -qi "UTILWISE" /tmp/blog-preview.html
          done
